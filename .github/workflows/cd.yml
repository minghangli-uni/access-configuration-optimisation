name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    if: github.repository == 'ACCESS-NRI/access-configuration-optimisation'  # no release from a fork or before the transfer
    uses: access-nri/actions/.github/workflows/release-python-package.yml@main
    needs: ci
    secrets: inherit
    permissions:
      contents: write
    with:
      pypi-package: true
      conda-package: false
      version-prefix: v
